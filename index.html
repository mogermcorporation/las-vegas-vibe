<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Las Vegas Vibe | Wild & Fun Meetups</title>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #070114;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #FFFFFF;
      }
      .custom-scroll::-webkit-scrollbar { display: none; }
      .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
      @keyframes pulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 230, 118, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
      }
      .live-pulse {
        animation: pulse 2s infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [selectedVibe, setSelectedVibe] = useState('All');
        const [showAuthGate, setShowAuthGate] = useState(false);
        const [selectedPerson, setSelectedPerson] = useState(null);

        // High-Energy, Aesthetic Profiles & Adventurous Meetups
        const profiles = [
          {
            id: "1",
            name: "Chloe & Mia",
            age: "24 & 25",
            badge: "GIRLS NIGHT OUT 🥂",
            status: "Looking for fun guys to join us for rooftop drinks at Waldorf then hit Omnia!",
            location: "Waldorf Astoria Rooftop Bar",
            zone: "The Strip",
            vibe: "Nightlife & Clubs",
            photo: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=800&q=80",
            time: "Active Now"
          },
          {
            id: "2",
            name: "Julian",
            age: "29",
            badge: "POOL VIBES ☀️",
            status: "Cabana reserved at Fontainebleau pool dayclub. Need fun people to split drinks and hang out!",
            location: "LIV Beach Dayclub",
            zone: "The Strip",
            vibe: "Pool Parties",
            photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=80",
            time: "10 mins ago"
          },
          {
            id: "3",
            name: "Sienna",
            age: "26",
            badge: "LATE NIGHT ADVENTURE 🌮",
            status: "Craving late night gourmet tacos in Chinatown then hidden speakeasy drinks. Who's driving?",
            location: "Chinatown Speakeasy Walk",
            zone: "Chinatown",
            vibe: "Food & Speakeasies",
            photo: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=800&q=80",
            time: "Active Now"
          },
          {
            id: "4",
            name: "Jaxson & Leo",
            age: "28 & 30",
            badge: "CASINO & COCKTAILS 🎲",
            status: "Playing blackjack at Cosmopolitan. Need a lucky charm to join us at the table!",
            location: "The Chandelier @ Cosmo",
            zone: "The Strip",
            vibe: "Casino & Lounges",
            photo: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=800&q=80",
            time: "5 mins ago"
          },
          {
            id: "5",
            name: "Vanessa",
            age: "27",
            badge: "COFFEE & SHOPPING ☕",
            status: "Grabbing iced lattes at Fashion Show Mall before hitting designer shops. Come walk with me!",
            location: "Starbucks @ Fashion Show",
            zone: "The Strip",
            vibe: "Casual & Chill",
            photo: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80",
            time: "15 mins ago"
          }
        ];

        const filteredProfiles = selectedVibe === 'All' 
          ? profiles 
          : profiles.filter(p => p.vibe === selectedVibe);

        const handleConnect = (person) => {
          setSelectedPerson(person);
          setShowAuthGate(true);
        };

        return (
          <div style={{ maxWidth: '480px', margin: '0 auto', minHeight: '100vh', paddingBottom: '90px', position: 'relative' }}>
            
            {/* VIBRANT TOP TICKER */}
            <div style={{ backgroundColor: '#FF007A', color: '#FFF', fontSize: '11px', fontWeight: '900', padding: '6px 12px', textAlign: 'center', letterSpacing: '0.5px' }}>
              🔥 1,240 PEOPLE MEETING UP IN VEGAS RIGHT NOW
            </div>

            {/* APP HEADER */}
            <header style={{ padding: '16px 16px 12px 16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <h1 style={{ margin: 0, fontSize: '26px', fontWeight: '900', fontStyle: 'italic', background: 'linear-gradient(90deg, #FF007A 0%, #00F0FF 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                  VEGAS VIBE ⚡
                </h1>
                <p style={{ margin: '2px 0 0 0', fontSize: '11px', color: '#FFD700', fontWeight: 'bold' }}>
                  Non-Stop Fun • Live Companions
                </p>
              </div>

              {/* LIVE PULSE INDICATOR */}
              <div style={{ display: 'flex', alignItems: 'center', gap: '6px', backgroundColor: 'rgba(0, 230, 118, 0.15)', padding: '6px 12px', borderRadius: '20px', border: '1px solid #00E676' }}>
                <span className="live-pulse" style={{ width: '8px', height: '8px', borderRadius: '50%', backgroundColor: '#00E676', display: 'inline-block' }}></span>
                <span style={{ fontSize: '10px', color: '#00E676', fontWeight: '900', textTransform: 'uppercase' }}>Live Feed</span>
              </div>
            </header>

            {/* HIGH-ENERGY VIBE CATEGORIES */}
            <div className="custom-scroll" style={{ display: 'flex', gap: '8px', padding: '0 16px 16px 16px', overflowX: 'auto' }}>
              {['All', 'Nightlife & Clubs', 'Pool Parties', 'Casual & Chill', 'Food & Speakeasies', 'Casino & Lounges'].map(vibe => (
                <button
                  key={vibe}
                  onClick={() => setSelectedVibe(vibe)}
                  style={{
                    padding: '8px 16px',
                    borderRadius: '25px',
                    border: 'none',
                    backgroundColor: selectedVibe === vibe ? '#FF007A' : '#180B30',
                    color: '#FFF',
                    fontSize: '12px',
                    fontWeight: '800',
                    cursor: 'pointer',
                    whiteSpace: 'nowrap',
                    boxShadow: selectedVibe === vibe ? '0 0 15px rgba(255,0,122,0.6)' : 'none',
                    transition: 'all 0.2s ease'
                  }}
                >
                  {vibe}
                </button>
              ))}
            </div>

            {/* ADVENTUROUS PHOTO FEED */}
            <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: '20px' }}>
              {filteredProfiles.map(person => (
                <div 
                  key={person.id} 
                  style={{ 
                    position: 'relative', 
                    borderRadius: '24px', 
                    overflow: 'hidden', 
                    backgroundColor: '#180B30', 
                    border: '1px solid #2D1454',
                    boxShadow: '0 12px 30px rgba(0,0,0,0.5)'
                  }}
                >
                  {/* Photo Container */}
                  <div style={{ position: 'relative', height: '360px', width: '100%' }}>
                    <img 
                      src={person.photo} 
                      alt={person.name} 
                      style={{ width: '100%', height: '100%', objectFit: 'cover' }} 
                    />
                    
                    {/* Dark Gradient Overlay for Crisp Text */}
                    <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, background: 'linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 40%, rgba(7,1,20,0.95) 100%)' }} />

                    {/* Top Floating Badges */}
                    <div style={{ position: 'absolute', top: '14px', left: '14px', right: '14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <span style={{ backgroundColor: '#FF007A', color: '#FFF', fontSize: '10px', fontWeight: '900', padding: '5px 12px', borderRadius: '15px', textTransform: 'uppercase', letterSpacing: '0.5px', boxShadow: '0 4px 10px rgba(0,0,0,0.3)' }}>
                        {person.badge}
                      </span>
                      <span style={{ backgroundColor: 'rgba(0,0,0,0.7)', color: '#00F0FF', fontSize: '10px', fontWeight: 'bold', padding: '5px 10px', borderRadius: '12px', backdropFilter: 'blur(4px)' }}>
                        ⚡ {person.time}
                      </span>
                    </div>

                    {/* Overlay Info */}
                    <div style={{ position: 'absolute', bottom: '16px', left: '16px', right: '16px' }}>
                      <h2 style={{ margin: 0, fontSize: '24px', fontWeight: '900', color: '#FFF' }}>
                        {person.name}, <span style={{ color: '#FFD700' }}>{person.age}</span>
                      </h2>
                      <p style={{ margin: '4px 0 8px 0', fontSize: '12px', color: '#00F0FF', fontWeight: 'bold' }}>
                        📍 {person.location} ({person.zone})
                      </p>
                      <p style={{ margin: 0, fontSize: '13px', color: '#FFF', lineHeight: '1.4', fontStyle: 'italic', textShadow: '0 2px 4px rgba(0,0,0,0.8)' }}>
                        "{person.status}"
                      </p>
                    </div>
                  </div>

                  {/* High-Converting Action Bar */}
                  <div style={{ padding: '14px 16px', backgroundColor: '#120726', display: 'flex', gap: '10px', alignItems: 'center' }}>
                    <button 
                      onClick={() => handleConnect(person)}
                      style={{ 
                        flex: 1, 
                        padding: '14px', 
                        borderRadius: '16px', 
                        background: 'linear-gradient(90deg, #FF007A 0%, #7B2CBF 100%)', 
                        color: '#FFF', 
                        border: 'none', 
                        fontWeight: '900', 
                        fontSize: '13px', 
                        cursor: 'pointer',
                        textTransform: 'uppercase',
                        letterSpacing: '0.5px',
                        boxShadow: '0 4px 15px rgba(255,0,122,0.4)'
                      }}
                    >
                      Join Outing / Chat Now →
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {/* SIGN-UP GATE MODAL */}
            {showAuthGate && (
              <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.92)', zIndex: 1000, display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '20px' }}>
                <div style={{ backgroundColor: '#180B30', borderRadius: '28px', padding: '28px', maxWidth: '320px', width: '100%', textAlign: 'center', border: '2px solid #FF007A', boxShadow: '0 0 40px rgba(255,0,122,0.5)' }}>
                  
                  <div style={{ fontSize: '36px', marginBottom: '8px' }}>🎉</div>
                  
                  <h2 style={{ margin: 0, color: '#FFF', fontSize: '22px', fontWeight: '900' }}>
                    JOIN THE FUN
                  </h2>
                  <p style={{ color: '#FFD700', fontSize: '12px', fontWeight: 'bold', margin: '6px 0 16px 0' }}>
                    Create a free account to message {selectedPerson?.name || 'companions'} & join meetups!
                  </p>

                  <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    <input 
                      type="email" 
                      placeholder="Your Email" 
                      style={{ padding: '14px', borderRadius: '12px', border: '1px solid #33155C', backgroundColor: '#0A0118', color: '#FFF', fontSize: '13px', outline: 'none' }}
                    />
                    <input 
                      type="password" 
                      placeholder="Create Password" 
                      style={{ padding: '14px', borderRadius: '12px', border: '1px solid #33155C', backgroundColor: '#0A0118', color: '#FFF', fontSize: '13px', outline: 'none' }}
                    />
                    <button 
                      onClick={() => { alert('Welcome to Vegas Vibe! Your account is ready.'); setShowAuthGate(false); }}
                      style={{ padding: '14px', borderRadius: '14px', background: 'linear-gradient(90deg, #FF007A 0%, #00F0FF 100%)', color: '#FFF', border: 'none', fontWeight: '900', fontSize: '14px', cursor: 'pointer', marginTop: '4px', textTransform: 'uppercase' }}
                    >
                      Unlock Full App Free
                    </button>
                  </div>

                  <button 
                    onClick={() => setShowAuthGate(false)}
                    style={{ backgroundColor: 'transparent', border: 'none', color: '#888', fontSize: '12px', marginTop: '16px', cursor: 'pointer' }}
                  >
                    Keep Browsing Feed
                  </button>

                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
