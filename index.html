<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Las Vegas Vibe</title>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body style="margin: 0; padding: 0; background-color: #0D0221;">
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [activeTab, setActiveTab] = useState('radar');
        const [vibeMode, setVibeMode] = useState('High Energy');
        const [selectedNeighborhood, setSelectedNeighborhood] = useState('All');
        const [showQRModal, setShowQRModal] = useState(false);
        const [selectedVenue, setSelectedVenue] = useState(null);

        const venues = [
          { id: 1, name: "Velveteen Rabbit", zone: "Arts District", perk: "15% Off Check + Free Craft App", category: "Speakeasy" },
          { id: 2, name: "The Chandelier", zone: "The Strip", perk: "2-for-1 Signature Cocktails", category: "Lounge" },
          { id: 3, name: "Golden Tiki", zone: "Chinatown", perk: "Complimentary Dole Whip Shot", category: "Tiki Bar" },
          { id: 4, name: "Honey Salt", zone: "Summerlin", perk: "Free Dessert with 2 Entrees", category: "Dining" }
        ];

        const events = [
          { id: 1, title: "Residency Concert at Caesars", venue: "The Colosseum", offer: "I Have an Extra Ticket", tag: "Show" },
          { id: 2, title: "Late Night Sushi & Drinks", venue: "Catch at ARIA", offer: "Looking to Split Bill", tag: "Dining" },
          { id: 3, title: "Dayclub Pool Party Crew", venue: "LIV Beach", offer: "Ticket Covered (My Guest)", tag: "Pool Party" }
        ];

        const filteredVenues = selectedNeighborhood === 'All' 
          ? venues 
          : venues.filter(v => v.zone === selectedNeighborhood);

        const handleOpenPass = (venue) => {
          setSelectedVenue(venue);
          setShowQRModal(true);
        };

        return (
          <div style={{ color: '#FFFFFF', minHeight: '100vh', fontFamily: 'system-ui, sans-serif', padding: '16px', maxWidth: '480px', margin: '0 auto' }}>
            
            {/* HEADER */}
            <header style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #2A085C', paddingBottom: '12px', marginBottom: '20px' }}>
              <div>
                <h1 style={{ margin: 0, fontSize: '22px', fontWeight: '900', color: '#FF007A' }}>
                  LAS VEGAS VIBE
                </h1>
                <p style={{ margin: 0, fontSize: '11px', color: '#A0A0B2' }}>⚡ 1,420 Active Beacons Tonight</p>
              </div>
              <div style={{ backgroundColor: '#1A0B36', padding: '6px 12px', borderRadius: '20px', border: '1px solid #7B2CBF', fontSize: '12px', fontWeight: 'bold', color: '#FFD700' }}>
                {vibeMode}
              </div>
            </header>

            {/* VIBE MODE SELECTOR */}
            <div style={{ display: 'flex', gap: '8px', marginBottom: '20px', overflowX: 'auto' }}>
              {['High Energy', 'Curated Lounge', 'Classic & Chill'].map(mode => (
                <button 
                  key={mode} 
                  onClick={() => setVibeMode(mode)}
                  style={{ 
                    padding: '8px 14px', 
                    borderRadius: '20px', 
                    border: 'none', 
                    backgroundColor: vibeMode === mode ? '#FF007A' : '#1A0B36', 
                    color: '#FFF', 
                    fontWeight: 'bold', 
                    cursor: 'pointer',
                    whiteSpace: 'nowrap',
                    fontSize: '12px'
                  }}
                >
                  {mode}
                </button>
              ))}
            </div>

            {/* NAVIGATION TABS */}
            <div style={{ display: 'flex', borderBottom: '2px solid #1A0B36', marginBottom: '20px' }}>
              {[
                { id: 'radar', label: '📍 Radar' },
                { id: 'events', label: '🎟️ Events & +1s' },
                { id: 'perks', label: '🍸 Dining Perks' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  style={{
                    flex: 1,
                    padding: '10px 4px',
                    backgroundColor: 'transparent',
                    border: 'none',
                    borderBottom: activeTab === tab.id ? '3px solid #FF007A' : 'none',
                    color: activeTab === tab.id ? '#FF007A' : '#A0A0B2',
                    fontWeight: 'bold',
                    cursor: 'pointer',
                    fontSize: '13px'
                  }}
                >
                  {tab.label}
                </button>
              ))}
            </div>

            {/* TAB 1: RADAR & VENUE MAP */}
            {activeTab === 'radar' && (
              <div>
                <div style={{ display: 'flex', gap: '6px', marginBottom: '16px', overflowX: 'auto' }}>
                  {['All', 'The Strip', 'Arts District', 'Chinatown', 'Summerlin'].map(zone => (
                    <button
                      key={zone}
                      onClick={() => setSelectedNeighborhood(zone)}
                      style={{
                        padding: '6px 10px',
                        borderRadius: '12px',
                        border: '1px solid #7B2CBF',
                        backgroundColor: selectedNeighborhood === zone ? '#7B2CBF' : '#0D0221',
                        color: '#FFF',
                        fontSize: '11px',
                        cursor: 'pointer',
                        whiteSpace: 'nowrap'
                      }}
                    >
                      {zone}
                    </button>
                  ))}
                </div>

                <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                  {filteredVenues.map(venue => (
                    <div key={venue.id} style={{ backgroundColor: '#1A0B36', borderRadius: '12px', padding: '16px', border: '1px solid #2A085C' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                        <h3 style={{ margin: 0, fontSize: '16px', color: '#FFF' }}>{venue.name}</h3>
                        <span style={{ fontSize: '10px', backgroundColor: '#2A085C', color: '#FFD700', padding: '3px 6px', borderRadius: '6px' }}>{venue.zone}</span>
                      </div>
                      <p style={{ color: '#FF007A', fontWeight: 'bold', margin: '8px 0', fontSize: '13px' }}>🎁 {venue.perk}</p>
                      <button 
                        onClick={() => handleOpenPass(venue)}
                        style={{ width: '100%', padding: '10px', borderRadius: '8px', backgroundColor: '#7B2CBF', color: '#FFF', border: 'none', fontWeight: 'bold', cursor: 'pointer', marginTop: '4px' }}
                      >
                        Generate Vibe Pass QR
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 2: EVENTS BOARD */}
            {activeTab === 'events' && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                {events.map(ev => (
                  <div key={ev.id} style={{ backgroundColor: '#1A0B36', borderRadius: '12px', padding: '16px', border: '1px solid #2A085C' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                      <span style={{ fontSize: '11px', color: '#A0A0B2' }}>{ev.venue}</span>
                      <span style={{ fontSize: '10px', color: '#FFD700', backgroundColor: '#2A085C', padding: '2px 6px', borderRadius: '6px' }}>{ev.tag}</span>
                    </div>
                    <h3 style={{ margin: '6px 0', fontSize: '15px', color: '#FFF' }}>{ev.title}</h3>
                    <p style={{ margin: '4px 0', fontSize: '12px', color: '#FF007A', fontWeight: 'bold' }}>{ev.offer}</p>
                    <button style={{ width: '100%', padding: '10px', borderRadius: '8px', backgroundColor: '#FF007A', color: '#FFF', border: 'none', fontWeight: 'bold', cursor: 'pointer', marginTop: '8px' }}>
                      Send Vibe Pitch
                    </button>
                  </div>
                ))}
              </div>
            )}

            {/* TAB 3: DINING PERKS */}
            {activeTab === 'perks' && (
              <div style={{ backgroundColor: '#1A0B36', borderRadius: '12px', padding: '20px', textAlign: 'center', border: '1px solid #2A085C' }}>
                <h2 style={{ color: '#FFD700', marginTop: 0, fontSize: '18px' }}>Partner Dining Perks</h2>
                <p style={{ color: '#A0A0B2', fontSize: '13px', lineHeight: '1.4' }}>Present your digital Vibe Pass to host stands or bartenders at participating Las Vegas venues to unlock check discounts and complimentary drinks.</p>
              </div>
            )}

            {/* VIBE PASS QR MODAL */}
            {showQRModal && (
              <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.85)', display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '20px', zIndex: 1000 }}>
                <div style={{ backgroundColor: '#1A0B36', borderRadius: '20px', padding: '24px', maxWidth: '280px', width: '100%', textAlign: 'center', border: '2px solid #FF007A' }}>
                  <h3 style={{ margin: 0, color: '#FF007A', fontSize: '16px' }}>OFFICIAL VIBE PASS</h3>
                  <p style={{ color: '#FFF', fontWeight: 'bold', margin: '6px 0', fontSize: '14px' }}>{selectedVenue?.name}</p>
                  
                  <div style={{ backgroundColor: '#FFF', padding: '16px', borderRadius: '12px', margin: '14px 0', display: 'inline-block' }}>
                    <div style={{ width: '120px', height: '120px', backgroundColor: '#000', display: 'flex', justifyContent: 'center', alignItems: 'center', color: '#FFF', fontSize: '10px' }}>
                      [ VIBE PASS QR ]
                    </div>
                  </div>

                  <p style={{ color: '#FFD700', fontSize: '12px', margin: 0, fontWeight: 'bold' }}>{selectedVenue?.perk}</p>
                  <p style={{ color: '#A0A0B2', fontSize: '10px', marginTop: '4px' }}>Valid for 3 hours from generation</p>

                  <button 
                    onClick={() => setShowQRModal(false)}
                    style={{ width: '100%', padding: '10px', borderRadius: '8px', backgroundColor: '#2A085C', color: '#FFF', border: 'none', fontWeight: 'bold', cursor: 'pointer', marginTop: '14px' }}
                  >
                    Close Pass
                  </button>
                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
