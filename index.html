<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Las Vegas Vibe | Dress Up. Step Out. Connect.</title>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #070114;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #FFFFFF;
      }
      .custom-scroll::-webkit-scrollbar { display: none; }
      .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
      @keyframes pulse {
        0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 230, 118, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 230, 118, 0); }
        100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 230, 118, 0); }
      }
      .live-pulse {
        animation: pulse 2s infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [selectedVibe, setSelectedVibe] = useState('All');
        const [showAuthGate, setShowAuthGate] = useState(false);
        const [showCoachingModal, setShowCoachingModal] = useState(false);
        const [coachingStep, setCoachingStep] = useState(1);
        const [selectedPerson, setSelectedPerson] = useState(null);

        // High-Energy, Aesthetic Profiles with Best Dressed Badges
        const profiles = [
          {
            id: "1",
            name: "Chloe & Mia",
            age: "24 & 25",
            badge: "✨ BEST DRESSED • GIRLS NIGHT 🥂",
            status: "Dressed up for rooftop drinks at Waldorf then hitting Omnia! Looking for fun company.",
            location: "Waldorf Astoria Rooftop Bar",
            zone: "The Strip",
            vibe: "Nightlife & Clubs",
            photo: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=800&q=80",
            time: "Active Now"
          },
          {
            id: "2",
            name: "Julian",
            age: "29",
            badge: "✨ BEST DRESSED • CABANA ☀️",
            status: "Sharp resort wear & cabana reserved at Fontainebleau pool. Come hang out!",
            location: "LIV Beach Dayclub",
            zone: "The Strip",
            vibe: "Pool Parties",
            photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=80",
            time: "10 mins ago"
          },
          {
            id: "3",
            name: "Sienna",
            age: "26",
            badge: "✨ ELEVATED • SPEAKEASY 🌮",
            status: "Gourmet tacos in Chinatown then hidden speakeasy drinks. Who's driving?",
            location: "Chinatown Speakeasy Walk",
            zone: "Chinatown",
            vibe: "Food & Speakeasies",
            photo: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=800&q=80",
            time: "Active Now"
          },
          {
            id: "4",
            name: "Jaxson & Leo",
            age: "28 & 30",
            badge: "✨ BEST DRESSED • CASINO 🎲",
            status: "Tailored suits & playing blackjack at Cosmopolitan. Need a lucky charm at the table!",
            location: "The Chandelier @ Cosmo",
            zone: "The Strip",
            vibe: "Casino & Lounges",
            photo: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=800&q=80",
            time: "5 mins ago"
          }
        ];

        const filteredProfiles = selectedVibe === 'All' 
          ? profiles 
          : profiles.filter(p => p.vibe === selectedVibe);

        const handleConnect = (person) => {
          setSelectedPerson(person);
          setShowAuthGate(true);
        };

        return (
          <div style={{ maxWidth: '480px', margin: '0 auto', minHeight: '100vh', paddingBottom: '90px', position: 'relative' }}>
            
            {/* VIBRANT TOP TICKER */}
            <div style={{ backgroundColor: '#FF007A', color: '#FFF', fontSize: '11px', fontWeight: '900', padding: '6px 12px', textAlign: 'center', letterSpacing: '0.5px' }}>
              🔥 DRESS UP. STEP OUT. 1,240 PEOPLE MEETING UP TONIGHT
            </div>

            {/* APP HEADER */}
            <header style={{ padding: '16px 16px 12px 16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <h1 style={{ margin: 0, fontSize: '24px', fontWeight: '900', fontStyle: 'italic', background: 'linear-gradient(90deg, #FF007A 0%, #00F0FF 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent' }}>
                  LAS VEGAS VIBE ⚡
                </h1>
                <p style={{ margin: '2px 0 0 0', fontSize: '11px', color: '#FFD700', fontWeight: 'bold' }}>
                  Look Your Best • Connect Live
                </p>
              </div>

              {/* PROFILE COACHING CTA */}
              <button 
                onClick={() => { setCoachingStep(1); setShowCoachingModal(true); }}
                style={{ backgroundColor: 'rgba(255, 215, 0, 0.15)', border: '1px solid #FFD700', borderRadius: '20px', padding: '6px 12px', color: '#FFD700', fontSize: '11px', fontWeight: 'bold', cursor: 'pointer' }}
              >
                📸 Photo Studio
              </button>
            </header>

            {/* HIGH-ENERGY VIBE CATEGORIES */}
            <div className="custom-scroll" style={{ display: 'flex', gap: '8px', padding: '0 16px 16px 16px', overflowX: 'auto' }}>
              {['All', 'Nightlife & Clubs', 'Pool Parties', 'Casual & Chill', 'Food & Speakeasies', 'Casino & Lounges'].map(vibe => (
                <button
                  key={vibe}
                  onClick={() => setSelectedVibe(vibe)}
                  style={{
                    padding: '8px 16px',
                    borderRadius: '25px',
                    border: 'none',
                    backgroundColor: selectedVibe === vibe ? '#FF007A' : '#180B30',
                    color: '#FFF',
                    fontSize: '12px',
                    fontWeight: '800',
                    cursor: 'pointer',
                    whiteSpace: 'nowrap',
                    boxShadow: selectedVibe === vibe ? '0 0 15px rgba(255,0,122,0.6)' : 'none'
                  }}
                >
                  {vibe}
                </button>
              ))}
            </div>

            {/* ADVENTUROUS PHOTO FEED */}
            <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: '20px' }}>
              {filteredProfiles.map(person => (
                <div 
                  key={person.id} 
                  style={{ 
                    position: 'relative', 
                    borderRadius: '24px', 
                    overflow: 'hidden', 
                    backgroundColor: '#180B30', 
                    border: '1px solid #2D1454',
                    boxShadow: '0 12px 30px rgba(0,0,0,0.5)'
                  }}
                >
                  <div style={{ position: 'relative', height: '360px', width: '100%' }}>
                    <img 
                      src={person.photo} 
                      alt={person.name} 
                      style={{ width: '100%', height: '100%', objectFit: 'cover' }} 
                    />
                    
                    <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, background: 'linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 40%, rgba(7,1,20,0.95) 100%)' }} />

                    <div style={{ position: 'absolute', top: '14px', left: '14px', right: '14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <span style={{ backgroundColor: 'rgba(0,0,0,0.8)', border: '1px solid #FFD700', color: '#FFD700', fontSize: '9px', fontWeight: '900', padding: '5px 10px', borderRadius: '15px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                        {person.badge}
                      </span>
                      <span style={{ backgroundColor: 'rgba(0,0,0,0.7)', color: '#00F0FF', fontSize: '10px', fontWeight: 'bold', padding: '5px 10px', borderRadius: '12px' }}>
                        ⚡ {person.time}
                      </span>
                    </div>

                    <div style={{ position: 'absolute', bottom: '16px', left: '16px', right: '16px' }}>
                      <h2 style={{ margin: 0, fontSize: '24px', fontWeight: '900', color: '#FFF' }}>
                        {person.name}, <span style={{ color: '#FFD700' }}>{person.age}</span>
                      </h2>
                      <p style={{ margin: '4px 0 8px 0', fontSize: '12px', color: '#00F0FF', fontWeight: 'bold' }}>
                        📍 {person.location} ({person.zone})
                      </p>
                      <p style={{ margin: 0, fontSize: '13px', color: '#FFF', lineHeight: '1.4', fontStyle: 'italic' }}>
                        "{person.status}"
                      </p>
                    </div>
                  </div>

                  <div style={{ padding: '14px 16px', backgroundColor: '#120726', display: 'flex', gap: '10px' }}>
                    <button 
                      onClick={() => handleConnect(person)}
                      style={{ 
                        flex: 1, 
                        padding: '14px', 
                        borderRadius: '16px', 
                        background: 'linear-gradient(90deg, #FF007A 0%, #7B2CBF 100%)', 
                        color: '#FFF', 
                        border: 'none', 
                        fontWeight: '900', 
                        fontSize: '13px', 
                        cursor: 'pointer',
                        textTransform: 'uppercase'
                      }}
                    >
                      Connect & Meet Up →
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {/* LOOK YOUR BEST PHOTO-COACHING MODAL */}
            {showCoachingModal && (
              <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.92)', zIndex: 1000, display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '20px' }}>
                <div style={{ backgroundColor: '#180B30', borderRadius: '28px', padding: '28px', maxWidth: '340px', width: '100%', textAlign: 'center', border: '2px solid #FFD700', boxShadow: '0 0 40px rgba(255,215,0,0.3)' }}>
                  
                  <div style={{ fontSize: '10px', color: '#FFD700', fontWeight: '900', letterSpacing: '1px', textTransform: 'uppercase' }}>
                    Vibe Photo Studio • Lesson {coachingStep} of 3
                  </div>

                  {coachingStep === 1 && (
                    <div>
                      <h2 style={{ color: '#FFF', fontSize: '20px', fontWeight: '900', margin: '12px 0 8px 0' }}>💡 Rule 1: Master Vegas Lighting</h2>
                      <p style={{ color: '#DDD', fontSize: '12px', lineHeight: '1.5' }}>
                        Skip hotel overhead lights. Use warm ambient lounge lighting or golden hour sunlight by resort pools. High contrast = high attraction.
                      </p>
                    </div>
                  )}

                  {coachingStep === 2 && (
                    <div>
                      <h2 style={{ color: '#FFF', fontSize: '20px', fontWeight: '900', margin: '12px 0 8px 0' }}>📐 Rule 2: Angles Over Selfies</h2>
                      <p style={{ color: '#DDD', fontSize: '12px', lineHeight: '1.5' }}>
                        No tight bathroom selfies. Have a friend capture mid-chest or full-body candid shots walking through upscale venues.
                      </p>
                    </div>
                  )}

                  {coachingStep === 3 && (
                    <div>
                      <h2 style={{ color: '#FFF', fontSize: '20px', fontWeight: '900', margin: '12px 0 8px 0' }}>👔 Rule 3: Dress Up & Stand Out</h2>
                      <p style={{ color: '#DDD', fontSize: '12px', lineHeight: '1.5' }}>
                        Vegas rewards high effort. Tailored jackets, chic evening dresses, or crisp resort wear unlock the ✨ Best Dressed profile badge!
                      </p>
                    </div>
                  )}

                  <div style={{ display: 'flex', gap: '10px', marginTop: '20px' }}>
                    {coachingStep < 3 ? (
                      <button 
                        onClick={() => setCoachingStep(coachingStep + 1)}
                        style={{ width: '100%', padding: '12px', borderRadius: '12px', backgroundColor: '#FF007A', color: '#FFF', border: 'none', fontWeight: 'bold', fontSize: '13px', cursor: 'pointer' }}
                      >
                        Next Tip →
                      </button>
                    ) : (
                      <button 
                        onClick={() => { setShowCoachingModal(false); setShowAuthGate(true); }}
                        style={{ width: '100%', padding: '12px', borderRadius: '12px', background: 'linear-gradient(90deg, #FFD700 0%, #FF007A 100%)', color: '#000', border: 'none', fontWeight: '900', fontSize: '13px', cursor: 'pointer' }}
                      >
                        Create My Profile Now ✨
                      </button>
                    )}
                  </div>

                  <button 
                    onClick={() => setShowCoachingModal(false)}
                    style={{ backgroundColor: 'transparent', border: 'none', color: '#888', fontSize: '11px', marginTop: '12px', cursor: 'pointer' }}
                  >
                    Close Studio
                  </button>

                </div>
              </div>
            )}

            {/* AUTH / SIGN-UP MODAL */}
            {showAuthGate && (
              <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.92)', zIndex: 1000, display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '20px' }}>
                <div style={{ backgroundColor: '#180B30', borderRadius: '28px', padding: '28px', maxWidth: '320px', width: '100%', textAlign: 'center', border: '2px solid #FF007A' }}>
                  <h2 style={{ margin: 0, color: '#FFF', fontSize: '20px', fontWeight: '900' }}>JOIN THE FUN</h2>
                  <p style={{ color: '#FFD700', fontSize: '12px', fontWeight: 'bold', margin: '6px 0 16px 0' }}>
                    Sign up free to connect with {selectedPerson?.name || 'companions'}!
                  </p>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    <input type="email" placeholder="Your Email" style={{ padding: '12px', borderRadius: '10px', border: '1px solid #33155C', backgroundColor: '#0A0118', color: '#FFF', fontSize: '13px', outline: 'none' }} />
                    <input type="password" placeholder="Create Password" style={{ padding: '12px', borderRadius: '10px', border: '1px solid #33155C', backgroundColor: '#0A0118', color: '#FFF', fontSize: '13px', outline: 'none' }} />
                    <button onClick={() => { alert('Welcome! Your profile is ready.'); setShowAuthGate(false); }} style={{ padding: '12px', borderRadius: '10px', background: 'linear-gradient(90deg, #FF007A 0%, #00F0FF 100%)', color: '#FFF', border: 'none', fontWeight: 'bold', fontSize: '14px', cursor: 'pointer' }}>
                      Create Free Account
                    </button>
                  </div>
                  <button onClick={() => setShowAuthGate(false)} style={{ backgroundColor: 'transparent', border: 'none', color: '#888', fontSize: '12px', marginTop: '14px', cursor: 'pointer' }}>Close</button>
                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
