<!DOCTYPE html>

        // Form & Upload States
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [fullName, setFullName] = useState('');
        const [photoPreview, setPhotoPreview] = useState(null);
        const [verifyingPhoto, setVerifyingPhoto] = useState(false);

        const [profiles, setProfiles] = useState([
          {
            id: "1",

            age: "24 & 25",
            badge: "✨ VERIFIED VIP • HIGH QUALITY 🥂",
            status: "Dressed up for rooftop drinks at Waldorf then hitting Omnia! Looking for high-energy company.",

            zone: "The Strip",

            {/* COMPANION FEED */}
            <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: '20px' }}>
              {filteredProfiles.map(person => (
                <div key={person.id} style={{ position: 'relative', borderRadius: '24px', overflow: 'hidden', backgroundColor: '#180B30', border: '1px solid #FFD700' }}>
                  <div style={{ position: 'relative', height: '360px', width: '100%' }}>
