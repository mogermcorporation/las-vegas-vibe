<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Las Vegas Vibe | The VIP Social Club</title>
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #05000C;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #FFFFFF;
      }
      .custom-scroll::-webkit-scrollbar { display: none; }
      .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
      @keyframes goldGlow {
        0% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); }
        50% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.8); }
        100% { box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); }
      }
      .vip-glow { animation: goldGlow 3s infinite; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      function App() {
        const [selectedCategory, setSelectedCategory] = useState('All');
        const [showAuthModal, setShowAuthModal] = useState(false);
        const [userGender, setUserGender] = useState('female');
        const [selectedPerson, setSelectedPerson] = useState(null);

        // Form States
        const [email, setEmail] = useState('');
        const [password, setPassword] = useState('');
        const [fullName, setFullName] = useState('');
        const [photoPreview, setPhotoPreview] = useState(null);

        // High-Glamour Showcase Profiles
        const [profiles, setProfiles] = useState([
          {
            id: "1",
            name: "Sienna & Natalia",
            age: "24 & 25",
            badge: "✨ VERIFIED VIP • HIGH GLAMOUR 🍾",
            status: "Dressed to the nines for rooftop cocktails at Waldorf then hitting Omnia main room! Looking for fun company to join.",
            location: "Waldorf Astoria Rooftop",
            zone: "The Strip",
            category: "Nightlife & Clubs",
            photo: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=800&q=80",
            time: "Active Right Now"
          },
          {
            id: "2",
            name: "Giselle",
            age: "26",
            badge: "✨ VERIFIED VIP • POOL CABANA ☀️",
            status: "Chic resort glam @ Fontainebleau dayclub. Splitting a VIP cabana and looking for a fun crew!",
            location: "LIV Beach Dayclub",
            zone: "The Strip",
            category: "Pool Dayclubs",
            photo: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=800&q=80",
            time: "5 mins ago"
          },
          {
            id: "3",
            name: "Julian",
            age: "29",
            badge: "🖤 BLACK KEY MEMBER • HIGH ROLLER 🎲",
            status: "Tailored suit & playing high-limit blackjack at Cosmopolitan. Need a lucky charm at the table!",
            location: "The Chandelier @ Cosmo",
            zone: "The Strip",
            category: "Casino & Lounges",
            photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=80",
            time: "10 mins ago"
          },
          {
            id: "4",
            name: "Adriana",
            age: "27",
            badge: "✨ VERIFIED VIP • SPEAKEASY 🍸",
            status: "Chinatown hidden speakeasy drinks & late night gourmet bites. Looking for someone with great energy!",
            location: "Chinatown Speakeasy Walk",
            zone: "Chinatown",
            category: "Speakeasies & Dining",
            photo: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80",
            time: "Active Now"
          }
        ]);

        const filteredProfiles = selectedCategory === 'All' 
          ? profiles 
          : profiles.filter(p => p.category === selectedCategory);

        const handleImageChange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onloadend = () => { setPhotoPreview(reader.result); };
            reader.readAsDataURL(file);
          }
        };

        const handleAuthSubmit = (e) => {
          e.preventDefault();
          if (userGender === 'male') {
            alert(`💳 Opening Stripe Checkout for Black Key Membership ($150.00)...`);
          } else {
            alert(`🎉 High-Quality Verification Approved! Welcome to Vegas Vibe.`);
          }
          setShowAuthModal(false);
        };

        return (
          <div style={{ maxWidth: '480px', margin: '0 auto', minHeight: '100vh', paddingBottom: '90px', position: 'relative' }}>
            
            {/* TOP GLAMOUR TICKER */}
            <div style={{ backgroundColor: '#FFD700', color: '#000', fontSize: '11px', fontWeight: '900', padding: '7px 12px', textAlign: 'center', letterSpacing: '1px', textTransform: 'uppercase' }}>
              👑 NOT AN EVERYDAY DATING APP • UNFORGETTABLE VEGAS NIGHTS
            </div>

            {/* APP FRONT COVER HEADER */}
            <header style={{ padding: '20px 16px 12px 16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
              <div>
                <h1 style={{ margin: 0, fontSize: '26px', fontWeight: '900', fontStyle: 'italic', background: 'linear-gradient(90deg, #FFD700 0%, #FF007A 100%)', WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent', letterSpacing: '0.5px' }}>
                  LAS VEGAS VIBE ⚡
                </h1>
                <p style={{ margin: '2px 0 0 0', fontSize: '11px', color: '#FFD700', fontWeight: 'bold' }}>
                  Dress Up. Step Out. Have The Best Time Ever.
                </p>
              </div>

              <button 
                onClick={() => setShowAuthModal(true)}
                className="vip-glow"
                style={{ background: 'linear-gradient(90deg, #FFD700 0%, #FF007A 100%)', border: 'none', borderRadius: '20px', padding: '8px 16px', color: '#000', fontSize: '11px', fontWeight: '900', cursor: 'pointer', textTransform: 'uppercase' }}
              >
                Apply For Pass
              </button>
            </header>

            {/* HIGH-STATUS OUTING CATEGORIES */}
            <div className="custom-scroll" style={{ display: 'flex', gap: '8px', padding: '0 16px 16px 16px', overflowX: 'auto' }}>
              {['All', 'Nightlife & Clubs', 'Pool Dayclubs', 'Speakeasies & Dining', 'Casino & Lounges'].map(cat => (
                <button
                  key={cat}
                  onClick={() => setSelectedCategory(cat)}
                  style={{
                    padding: '8px 16px',
                    borderRadius: '25px',
                    border: 'none',
                    backgroundColor: selectedCategory === cat ? '#FF007A' : '#140728',
                    color: '#FFF',
                    fontSize: '12px',
                    fontWeight: '800',
                    cursor: 'pointer',
                    whiteSpace: 'nowrap',
                    boxShadow: selectedCategory === cat ? '0 0 15px rgba(255,0,122,0.6)' : 'none'
                  }}
                >
                  {cat}
                </button>
              ))}
            </div>

            {/* HERO COMPANION FEED */}
            <div style={{ padding: '0 16px', display: 'flex', flexDirection: 'column', gap: '22px' }}>
              {filteredProfiles.map(person => (
                <div 
                  key={person.id} 
                  style={{ 
                    position: 'relative', 
                    borderRadius: '28px', 
                    overflow: 'hidden', 
                    backgroundColor: '#140728', 
                    border: '1px solid #FFD700',
                    boxShadow: '0 15px 35px rgba(0,0,0,0.6)'
                  }}
                >
                  <div style={{ position: 'relative', height: '400px', width: '100%' }}>
                    <img src={person.photo} alt={person.name} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                    <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, background: 'linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(5,0,12,0.95) 100%)' }} />

                    <div style={{ position: 'absolute', top: '16px', left: '16px', right: '16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                      <span style={{ backgroundColor: 'rgba(0,0,0,0.85)', border: '1px solid #FFD700', color: '#FFD700', fontSize: '9px', fontWeight: '900', padding: '6px 12px', borderRadius: '20px', textTransform: 'uppercase', letterSpacing: '0.5px' }}>
                        {person.badge}
                      </span>
                      <span style={{ backgroundColor: 'rgba(0,0,0,0.7)', color: '#00F0FF', fontSize: '10px', fontWeight: 'bold', padding: '5px 10px', borderRadius: '12px' }}>
                        ⚡ {person.time}
                      </span>
                    </div>

                    <div style={{ position: 'absolute', bottom: '18px', left: '18px', right: '18px' }}>
                      <h2 style={{ margin: 0, fontSize: '26px', fontWeight: '900', color: '#FFF' }}>
                        {person.name}, <span style={{ color: '#FFD700' }}>{person.age}</span>
                      </h2>
                      <p style={{ margin: '4px 0 8px 0', fontSize: '12px', color: '#00F0FF', fontWeight: 'bold' }}>
                        📍 {person.location} ({person.zone})
                      </p>
                      <p style={{ margin: 0, fontSize: '14px', color: '#FFF', fontStyle: 'italic', lineHeight: '1.4' }}>
                        "{person.status}"
                      </p>
                    </div>
                  </div>

                  <div style={{ padding: '16px', backgroundColor: '#0D031C' }}>
                    <button 
                      onClick={() => { setSelectedPerson(person); setShowAuthModal(true); }}
                      style={{ 
                        width: '100%', 
                        padding: '15px', 
                        borderRadius: '18px', 
                        background: 'linear-gradient(90deg, #FFD700 0%, #FF007A 100%)', 
                        color: '#000', 
                        border: 'none', 
                        fontWeight: '900', 
                        fontSize: '13px', 
                        cursor: 'pointer', 
                        textTransform: 'uppercase',
                        letterSpacing: '0.5px'
                      }}
                    >
                      Connect For Outing →
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {/* MEMBER PASS MODAL */}
            {showAuthModal && (
              <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.94)', zIndex: 1000, display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '20px' }}>
                <div style={{ backgroundColor: '#140728', borderRadius: '28px', padding: '28px', maxWidth: '330px', width: '100%', textAlign: 'center', border: '2px solid #FFD700', boxShadow: '0 0 40px rgba(255,215,0,0.4)', maxHeight: '90vh', overflowY: 'auto' }}>
                  
                  <h2 style={{ margin: 0, color: '#FFF', fontSize: '20px', fontWeight: '900' }}>
                    VIP MEMBER PASS
                  </h2>
                  <p style={{ color: '#FFD700', fontSize: '12px', fontWeight: 'bold', margin: '4px 0 16px 0' }}>
                    Dress Up. Step Out. Experience Vegas at its Best.
                  </p>

                  <div style={{ display: 'flex', gap: '8px', marginBottom: '16px' }}>
                    <button 
                      type="button"
                      onClick={() => setUserGender('female')}
                      style={{ flex: 1, padding: '12px 8px', borderRadius: '14px', border: userGender === 'female' ? '2px solid #FF007A' : '1px solid #33155C', backgroundColor: userGender === 'female' ? '#FF007A' : '#0A0118', color: '#FFF', fontWeight: 'bold', fontSize: '11px', cursor: 'pointer' }}
                    >
                      💃 Women Pass<br/><span style={{ color: '#FFD700', fontSize: '12px', fontWeight: '900' }}>100% FREE</span>
                    </button>
                    <button 
                      type="button"
                      onClick={() => setUserGender('male')}
                      style={{ flex: 1, padding: '12px 8px', borderRadius: '14px', border: userGender === 'male' ? '2px solid #FFD700' : '1px solid #33155C', backgroundColor: userGender === 'male' ? '#120726' : '#0A0118', color: '#FFF', fontWeight: 'bold', fontSize: '11px', cursor: 'pointer' }}
                    >
                      🕺 Men Black Key<br/><span style={{ color: '#FFD700', fontSize: '12px', fontWeight: '900' }}>$150 PASS</span>
                    </button>
                  </div>

                  <form onSubmit={handleAuthSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                    <input type="text" required placeholder="First Name & Initial" value={fullName} onChange={(e) => setFullName(e.target.value)} style={{ padding: '12px', borderRadius: '12px', border: '1px solid #33155C', backgroundColor: '#0A0118', color: '#FFF', fontSize: '13px', outline: 'none' }} />
                    
                    <div style={{ border: '2px dashed #FFD700', borderRadius: '16px', padding: '14px', backgroundColor: '#0A0118', textAlign: 'center' }}>
                      <p style={{ margin: '0 0 4px 0', fontSize: '11px', color: '#FFF', fontWeight: 'bold' }}>📷 Upload High-Resolution Outfit Photo</p>
                      <p style={{ margin: '0 0 8px 0', fontSize: '10px', color: '#888' }}>Lounge lighting or pool daylight required</p>
                      <label style={{ display: 'inline-block', backgroundColor: '#FFD700', color: '#000', padding: '6px 12px', borderRadius: '10px', fontSize: '11px', fontWeight: '900', cursor: 'pointer' }}>
                        Choose Photo
                        <input type="file" accept="image/*" onChange={handleImageChange} style={{ display: 'none' }} />
                      </label>
                    </div>

                    <input type="email" required placeholder="Your Email" value={email} onChange={(e) => setEmail(e.target.value)} style={{ padding: '12px', borderRadius: '12px', border: '1px solid #33155C', backgroundColor: '#0A0118', color: '#FFF', fontSize: '13px', outline: 'none' }} />
                    <input type="password" required placeholder="Create Password" value={password} onChange={(e) => setPassword(e.target.value)} style={{ padding: '12px', borderRadius: '12px', border: '1px solid #33155C', backgroundColor: '#0A0118', color: '#FFF', fontSize: '13px', outline: 'none' }} />
                    
                    <button type="submit" style={{ padding: '14px', borderRadius: '14px', background: userGender === 'female' ? 'linear-gradient(90deg, #FF007A 0%, #7B2CBF 100%)' : 'linear-gradient(90deg, #FFD700 0%, #FF007A 100%)', color: userGender === 'female' ? '#FFF' : '#000', border: 'none', fontWeight: '900', fontSize: '13px', cursor: 'pointer', textTransform: 'uppercase' }}>
                      {userGender === 'female' ? 'Submit Profile & Unlock VIP ✨' : 'Pay $150 & Unlock Black Key 🔑'}
                    </button>
                  </form>

                  <button onClick={() => setShowAuthModal(false)} style={{ backgroundColor: 'transparent', border: 'none', color: '#888', fontSize: '12px', marginTop: '14px', cursor: 'pointer' }}>Close</button>

                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
