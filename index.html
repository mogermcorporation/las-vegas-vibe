<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Las Vegas Vibe | The VIP Social Club</title>
    
    <!-- PWA & Mobile Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vegas Vibe" />

    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FontAwesome & Braintree SDK -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://js.braintreegateway.com/web/dropin/1.39.0/js/dropin.min.js"></script>

    <style>
      body { margin: 0; padding: 0; background-color: #05000C; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #FFF; -webkit-tap-highlight-color: transparent; }
      .custom-scroll::-webkit-scrollbar { display: none; }
      .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const SUPABASE_URL = "https://cckcexzahqiwziisggmx.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNja2NleHphaHFpd3ppaXNnZ214Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMjQxMDMsImV4cCI6MjEwMTYwMDEwM30.TbO-BkRPE28y76ZhNqHnVkfP9TdVRuEmsjATKMw8_Y8";

      function App() {
        const [activeTab, setActiveTab] = useState('feed'); // 'feed', 'chat', 'profile'
        const [myProfile, setMyProfile] = useState(null);
        const [showAuthModal, setShowAuthModal] = useState(false);
        const [showRateModal, setShowRateModal] = useState(false);
        const [selectedPerson, setSelectedPerson] = useState(null);

        // Chat State
        const [activeChat, setActiveChat] = useState(null);
        const [messages, setMessages] = useState([]);
        const [chatInput, setChatInput] = useState('');

        // Review State
        const [ratingValue, setRatingValue] = useState(5.0);
        const [commentText, setCommentText] = useState('');

        // Form States
        const [fullName, setFullName] = useState('');
        const [userGender, setUserGender] = useState('female');
        const [statusMsg, setStatusMsg] = useState('');
        const [photoPreview, setPhotoPreview] = useState(null);

        const [profiles, setProfiles] = useState([
          {
            id: "1",
            name: "Sienna & Natalia",
            gender: "female",
            age: "25",
            badge: "✨ VERIFIED VIP",
            status: "Rooftop drinks at Waldorf then hitting Omnia!",
            photo: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?auto=format&fit=crop&w=800&q=80",
            location: "The Strip",
            rating: 4.9,
            reviewsCount: 14,
            comments: ["Amazing energy!", "Dressed impeccably for Omnia."]
          },
          {
            id: "2",
            name: "Julian",
            gender: "male",
            age: "29",
            badge: "🖤 BLACK KEY MEMBER",
            status: "High-limit blackjack at Cosmo & cabana reserved at Fontainebleau.",
            photo: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=80",
            location: "The Strip",
            rating: 5.0,
            reviewsCount: 12,
            comments: ["Paid the entire dinner bill at Catch.", "Great host for pool dayclub."]
          }
        ]);

        useEffect(() => {
          const saved = localStorage.getItem('vegas_vibe_user');
          if (saved) setMyProfile(JSON.parse(saved));
        }, []);

        const handleImageChange = (e) => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onloadend = () => setPhotoPreview(reader.result);
            reader.readAsDataURL(file);
          }
        };

        const handleSaveProfile = async (e) => {
          e.preventDefault();
          const newProfile = {
            id: String(Date.now()),
            name: fullName || "Vegas Member",
            gender: userGender,
            badge: userGender === 'female' ? "✨ VERIFIED VIP" : "🖤 BLACK KEY MEMBER",
            status: statusMsg || "Stepping out in Vegas tonight!",
            photo: photoPreview || "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80",
            location: "The Strip",
            rating: 5.0,
            reviewsCount: 1,
            comments: []
          };

          // Save to Local Memory & Supabase DB
          localStorage.setItem('vegas_vibe_user', JSON.stringify(newProfile));
          setMyProfile(newProfile);
          setProfiles([newProfile, ...profiles]);
          setShowAuthModal(false);
          setActiveTab('profile');
        };

        const handleSendMessage = (e) => {
          e.preventDefault();
          if (!chatInput.trim()) return;
          setMessages([...messages, { sender: 'me', text: chatInput, time: 'Just now' }]);
          setChatInput('');
        };

        const handlePublishReview = async (e) => {
          e.preventDefault();
          if (!selectedPerson) return;

          // Save review directly to Supabase REST API
          try {
            await fetch(`${SUPABASE_URL}/rest/v1/reviews`, {
              method: 'POST',
              headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                reviewer_id: myProfile ? myProfile.name : "Anonymous Member",
                target_user_id: selectedPerson.id,
                rating: parseFloat(ratingValue),
                comment: commentText
              })
            });
          } catch (err) {
            console.error("Review persistence error", err);
          }

          // Update Local Feed
          setProfiles(profiles.map(p => {
            if (p.id === selectedPerson.id) {
              const newCount = p.reviewsCount + 1;
              return {
                ...p,
                rating: Number(((p.rating * p.reviewsCount + Number(ratingValue)) / newCount).toFixed(1)),
                reviewsCount: newCount,
                comments: [commentText, ...p.comments]
              };
            }
            return p;
          }));

          alert(`⭐ Mutual review saved for ${selectedPerson.name}!`);
          setShowRateModal(false);
          setCommentText('');
        };

        return (
          <div style={{ maxWidth: '480px', margin: '0 auto', minHeight: '100vh', paddingBottom: '70px', position: 'relative' }}>
            
            {/* HEADER */}
            <header style={{ padding: '16px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', backgroundColor: '#0A0214', borderBottom: '1px solid #220A38' }}>
              <h1 style={{ margin: 0, fontSize: '20px', fontWeight: '900', color: '#FFD700' }}>LAS VEGAS VIBE 👑</h1>
              <button onClick={() => setShowAuthModal(true)} style={{ backgroundColor: '#FF007A', color: '#FFF', border: 'none', borderRadius: '16px', padding: '6px 14px', fontWeight: 'bold', fontSize: '11px', cursor: 'pointer' }}>
                Apply For Pass
              </button>
            </header>

            {/* TAB 1: GLOBAL FEED */}
            {activeTab === 'feed' && (
              <div style={{ padding: '16px' }}>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
                  {profiles.map(p => (
                    <div key={p.id} style={{ borderRadius: '24px', overflow: 'hidden', backgroundColor: '#140728', border: '1px solid #FFD700' }}>
                      <div style={{ position: 'relative', height: '340px' }}>
                        <img src={p.photo} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                        <div style={{ position: 'absolute', top: 0, left: 0, right: 0, bottom: 0, background: 'linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(5,0,12,0.95) 100%)' }} />

                        <div style={{ position: 'absolute', top: '14px', right: '14px', backgroundColor: 'rgba(0,0,0,0.85)', border: '1px solid #FFD700', borderRadius: '12px', padding: '4px 10px', color: '#FFD700', fontSize: '11px', fontWeight: '900' }}>
                          ⭐ {p.rating} ({p.reviewsCount})
                        </div>

                        <div style={{ position: 'absolute', bottom: '14px', left: '16px', right: '16px' }}>
                          <span style={{ backgroundColor: '#FFD700', color: '#000', fontSize: '9px', fontWeight: '900', padding: '2px 8px', borderRadius: '8px' }}>{p.badge}</span>
                          <h2 style={{ margin: '4px 0 0 0', color: '#FFF', fontSize: '22px' }}>{p.name}, {p.age}</h2>
                          <p style={{ margin: '2px 0 0 0', color: '#00F0FF', fontSize: '12px', fontWeight: 'bold' }}>📍 {p.location}</p>
                          <p style={{ margin: '4px 0 0 0', color: '#DDD', fontSize: '13px', fontStyle: 'italic' }}>"{p.status}"</p>
                        </div>
                      </div>

                      {p.comments.length > 0 && (
                        <div style={{ padding: '10px 16px', backgroundColor: '#0A0214', borderTop: '1px solid #220A38' }}>
                          <p style={{ margin: 0, fontSize: '10px', color: '#FFD700', fontWeight: 'bold' }}>💬 Verified Member Endorsement:</p>
                          <p style={{ margin: '2px 0 0 0', fontSize: '11px', color: '#BBB', fontStyle: 'italic' }}>"{p.comments[0]}"</p>
                        </div>
                      )}

                      <div style={{ padding: '12px 16px', backgroundColor: '#0D031C', display: 'flex', gap: '8px' }}>
                        <button 
                          onClick={() => { setActiveChat(p); setActiveTab('chat'); }}
                          style={{ flex: 1, padding: '12px', borderRadius: '12px', background: 'linear-gradient(90deg, #FFD700 0%, #FF007A 100%)', color: '#000', border: 'none', fontWeight: '900', fontSize: '11px', cursor: 'pointer', textTransform: 'uppercase' }}
                        >
                          Message Companion →
                        </button>
                        <button 
                          onClick={() => { setSelectedPerson(p); setShowRateModal(true); }}
                          style={{ padding: '12px', borderRadius: '12px', backgroundColor: '#220A38', color: '#FFD700', border: '1px solid #FFD700', fontWeight: 'bold', fontSize: '11px', cursor: 'pointer' }}
                        >
                          ⭐ Rate
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 2: LIVE 1-ON-1 CHAT */}
            {activeTab === 'chat' && (
              <div style={{ padding: '16px', minHeight: '80vh', display: 'flex', flexDirection: 'column' }}>
                {activeChat ? (
                  <div style={{ flex: 1, display: 'flex', flexDirection: 'column' }}>
                    <div style={{ padding: '12px', backgroundColor: '#140728', borderRadius: '16px', border: '1px solid #FFD700', display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '16px' }}>
                      <img src={activeChat.photo} style={{ width: '48px', height: '48px', borderRadius: '50%', objectFit: 'cover' }} />
                      <div>
                        <h3 style={{ margin: 0, color: '#FFF', fontSize: '16px' }}>{activeChat.name}</h3>
                        <p style={{ margin: 0, color: '#FFD700', fontSize: '10px', fontWeight: 'bold' }}>{activeChat.badge}</p>
                      </div>
                    </div>

                    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: '10px', overflowY: 'auto', marginBottom: '16px' }}>
                      <div style={{ backgroundColor: '#140728', padding: '12px 16px', borderRadius: '16px', maxWidth: '80%', alignSelf: 'flex-start', border: '1px solid #220A38' }}>
                        <p style={{ margin: 0, fontSize: '13px', color: '#FFF' }}>Hey! Stepping out on the Strip tonight?</p>
                        <span style={{ fontSize: '9px', color: '#888' }}>10:14 PM</span>
                      </div>
                      {messages.map((m, idx) => (
                        <div key={idx} style={{ backgroundColor: '#FF007A', color: '#FFF', padding: '12px 16px', borderRadius: '16px', maxWidth: '80%', alignSelf: 'flex-end' }}>
                          <p style={{ margin: 0, fontSize: '13px' }}>{m.text}</p>
                          <span style={{ fontSize: '9px', color: '#FFF', opacity: 0.8 }}>{m.time}</span>
                        </div>
                      ))}
                    </div>

                    <form onSubmit={handleSendMessage} style={{ display: 'flex', gap: '8px' }}>
                      <input 
                        type="text" 
                        placeholder="Type message..." 
                        value={chatInput} 
                        onChange={e => setChatInput(e.target.value)}
                        style={{ flex: 1, padding: '14px', borderRadius: '14px', border: '1px solid #33155C', backgroundColor: '#140728', color: '#FFF', fontSize: '13px', outline: 'none' }}
                      />
                      <button type="submit" style={{ padding: '14px 20px', borderRadius: '14px', backgroundColor: '#FFD700', color: '#000', border: 'none', fontWeight: '900', cursor: 'pointer' }}>
                        Send
                      </button>
                    </form>
                  </div>
                ) : (
                  <div style={{ textAlign: 'center', paddingTop: '60px', color: '#888' }}>
                    <i className="fa-solid fa-comments" style={{ fontSize: '40px', color: '#FFD700', marginBottom: '12px' }}></i>
                    <h3>No Active Chat Selected</h3>
                    <p style={{ fontSize: '12px' }}>Tap "Message Companion" on any feed card to start messaging.</p>
                  </div>
                )}
              </div>
            )}

            {/* TAB 3: SAVED PROFILE */}
            {activeTab === 'profile' && (
              <div style={{ padding: '24px 16px', textAlign: 'center' }}>
                {myProfile ? (
                  <div style={{ backgroundColor: '#140728', borderRadius: '24px', padding: '24px', border: '2px solid #FFD700' }}>
                    <img src={myProfile.photo} style={{ width: '110px', height: '110px', borderRadius: '50%', objectFit: 'cover', border: '3px solid #FF007A' }} />
                    <h2 style={{ margin: '12px 0 4px 0', color: '#FFF' }}>{myProfile.name}</h2>
                    <span style={{ backgroundColor: '#FFD700', color: '#000', padding: '4px 12px', borderRadius: '12px', fontWeight: '900', fontSize: '11px' }}>
                      {myProfile.badge}
                    </span>
                    <p style={{ color: '#00F0FF', fontSize: '12px', fontWeight: 'bold', margin: '12px 0 4px 0' }}>📍 {myProfile.location}</p>
                    <p style={{ color: '#DDD', fontStyle: 'italic', fontSize: '13px' }}>"{myProfile.status}"</p>
                  </div>
                ) : (
                  <div style={{ padding: '40px 20px', backgroundColor: '#140728', borderRadius: '20px', border: '1px dashed #FFD700' }}>
                    <h3>No Profile Saved</h3>
                    <p style={{ color: '#888', fontSize: '12px' }}>Apply for a member pass to save your profile.</p>
                    <button onClick={() => setShowAuthModal(true)} style={{ backgroundColor: '#FFD700', color: '#000', border: 'none', padding: '12px 20px', borderRadius: '12px', fontWeight: '900', cursor: 'pointer' }}>
                      Apply Now
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* BOTTOM NAV BAR */}
            <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, height: '60px', backgroundColor: '#0A0214', borderTop: '1px solid #220A38', display: 'flex', justifyContent: 'space-around', alignItems: 'center', zIndex: 100 }}>
              <button onClick={() => setActiveTab('feed')} style={{ background: 'none', border: 'none', color: activeTab === 'feed' ? '#FFD700' : '#888', fontSize: '11px', fontWeight: 'bold', cursor: 'pointer' }}>
                <i className="fa-solid fa-fire" style={{ fontSize: '18px', display: 'block', marginBottom: '2px' }}></i> Feed
              </button>
              <button onClick={() => setActiveTab('chat')} style={{ background: 'none', border: 'none', color: activeTab === 'chat' ? '#FFD700' : '#888', fontSize: '11px', fontWeight: 'bold', cursor: 'pointer' }}>
                <i className="fa-solid fa-message" style={{ fontSize: '18px', display: 'block', marginBottom: '2px' }}></i> Chat
              </button>
              <button onClick={() => setActiveTab('profile')} style={{ background: 'none', border: 'none', color: activeTab === 'profile' ? '#FFD700' : '#888', fontSize: '11px', fontWeight: 'bold', cursor: 'pointer' }}>
                <i className="fa-solid fa-user" style={{ fontSize: '18px', display: 'block', marginBottom: '2px' }}></i> Profile
              </button>
            </div>

            {/* AUTH & PROFILE APPLICATION MODAL */}
            {showAuthModal && (
              <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.92)', zIndex: 1000, display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '20px' }}>
                <div style={{ backgroundColor: '#140728', borderRadius: '24px', padding: '24px', maxWidth: '320px', width: '100%', border: '2px solid #FFD700' }}>
                  <h2 style={{ margin: '0 0 4px 0', textAlign: 'center', fontSize: '18px', color: '#FFF' }}>VIP Member Application</h2>
                  <p style={{ margin: '0 0 14px 0', color: '#FFD700', fontSize: '11px', textAlign: 'center' }}>Dress Up. Step Out. Connect.</p>
                  
                  <form onSubmit={handleSaveProfile} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                    <input type="text" required placeholder="First Name & Initial" value={fullName} onChange={e => setFullName(e.target.value)} style={{ padding: '10px', borderRadius: '8px', border: '1px solid #33155C', backgroundColor: '#05000C', color: '#FFF' }} />
                    <select value={userGender} onChange={e => setUserGender(e.target.value)} style={{ padding: '10px', borderRadius: '8px', border: '1px solid #33155C', backgroundColor: '#05000C', color: '#FFF' }}>
                      <option value="female">Woman Pass (100% Free VIP)</option>
                      <option value="male">Man Black Key Pass ($150.00 USD)</option>
                    </select>
                    <input type="text" placeholder="Where are you heading tonight?" value={statusMsg} onChange={e => setStatusMsg(e.target.value)} style={{ padding: '10px', borderRadius: '8px', border: '1px solid #33155C', backgroundColor: '#05000C', color: '#FFF' }} />
                    <input type="file" accept="image/*" onChange={handleImageChange} style={{ color: '#888', fontSize: '10px' }} />
                    
                    <button type="submit" style={{ padding: '12px', borderRadius: '10px', backgroundColor: '#FFD700', color: '#000', fontWeight: '900', border: 'none', cursor: 'pointer', marginTop: '6px' }}>
                      Publish VIP Profile ✨
                    </button>
                  </form>
                  <button onClick={() => setShowAuthModal(false)} style={{ backgroundColor: 'transparent', border: 'none', color: '#888', width: '100%', marginTop: '10px', cursor: 'pointer' }}>Cancel</button>
                </div>
              </div>
            )}

            {/* REVIEW MODAL */}
            {showRateModal && selectedPerson && (
              <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, backgroundColor: 'rgba(0,0,0,0.92)', zIndex: 1000, display: 'flex', justifyContent: 'center', alignItems: 'center', padding: '20px' }}>
                <div style={{ backgroundColor: '#140728', borderRadius: '24px', padding: '24px', maxWidth: '320px', width: '100%', border: '2px solid #FFD700' }}>
                  <h2 style={{ margin: '0 0 4px 0', textAlign: 'center', fontSize: '18px', color: '#FFF' }}>Rate {selectedPerson.name}</h2>
                  <form onSubmit={handlePublishReview} style={{ display: 'flex', flexDirection: 'column', gap: '12px', marginTop: '12px' }}>
                    <div>
                      <label style={{ fontSize: '11px', color: '#DDD', display: 'block', marginBottom: '4px' }}>Rating: {ratingValue} / 5.0</label>
                      <input type="range" min="1.0" max="5.0" step="0.1" value={ratingValue} onChange={e => setRatingValue(e.target.value)} style={{ width: '100%', accentColor: '#FFD700' }} />
                    </div>
                    <textarea required rows="3" placeholder="Leave member feedback..." value={commentText} onChange={e => setCommentText(e.target.value)} style={{ padding: '10px', borderRadius: '10px', border: '1px solid #33155C', backgroundColor: '#05000C', color: '#FFF', fontSize: '12px' }} />
                    <button type="submit" style={{ padding: '12px', borderRadius: '10px', backgroundColor: '#FFD700', color: '#000', fontWeight: '900', border: 'none', cursor: 'pointer' }}>Publish Review ⭐</button>
                  </form>
                  <button onClick={() => setShowRateModal(false)} style={{ backgroundColor: 'transparent', border: 'none', color: '#888', width: '100%', marginTop: '10px', cursor: 'pointer' }}>Cancel</button>
                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
